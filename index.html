<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Crias Games</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; }
      main { width: min(100%, 1100px); text-align: center; }
      h1 { margin: 0 0 1.5rem; font-size: clamp(2rem, 6vw, 4rem); }
      img { display: block; width: 100%; height: auto; border-radius: 1rem; box-shadow: 0 24px 80px #0008; }
      p { color: #9ca3af; }
    </style>
  </head>
  <body>
    <main>
      <h1>Crias Games</h1>
      <img src="mockup.png" alt="Crias Games project mockup">
      <p>Game in progress.</p>
    </main>
  </body>
</html>
